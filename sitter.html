<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pet Sitter Info — Pawfolio</title>
  <!-- Link preview (Open Graph + Twitter) so messaging apps show a clean card
       instead of the raw long URL. These are STATIC tags only — no pet data is
       exposed; all shared info lives privately in the link's #fragment. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pawfolio">
  <meta property="og:title" content="Pet Sitter Info — Pawfolio">
  <meta property="og:description" content="Tap to open the pet sitter instructions shared with you.">
  <!-- og:url is the canonical/clean address. Messaging apps build the preview
       card from THIS short URL (and strip the long #fragment from the card),
       while a tap still opens the full link including the private #data. -->
  <meta property="og:url" content="https://cleartrackapps.com/pet-care-planner/sitter.html">
  <meta property="og:image" content="https://cleartrackapps.com/pet-care-planner/icon-192.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="192">
  <meta property="og:image:height" content="192">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Pet Sitter Info — Pawfolio">
  <meta name="twitter:description" content="Tap to open the pet sitter instructions shared with you.">
  <meta name="twitter:image" content="https://cleartrackapps.com/pet-care-planner/icon-192.png">
  <style>
    :root{ --accent:#5B5BD6; --accent-dark:#4C4CC8; --ink:#1f2733; --muted:#64748b; --line:#e6e8ef; --bg:#f6f7fb; --card:#ffffff; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:rgba(91,91,214,0.15); }
    html,body{ margin:0; padding:0; }
    html{ scroll-behavior:smooth; }
    body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
    .wrap{ max-width:640px; margin:0 auto; padding:0 16px 48px; }
    header{ background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff; padding:22px 20px; border-radius:0 0 18px 18px; }
    .brand{ font-size:13px; opacity:0.95; letter-spacing:0.3px; display:flex; align-items:center; gap:8px; }
    .brand .by{ margin-left:auto; font-size:11px; font-weight:600; opacity:0.8; letter-spacing:0.2px; }
    .brand img{ width:26px; height:26px; border-radius:6px; flex-shrink:0; display:block; }
    header h1{ margin:4px 0 2px; font-size:22px; font-weight:800; }
    header .sub{ font-size:13px; opacity:0.92; }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 16px 6px; margin-top:16px; box-shadow:0 1px 2px rgba(16,24,40,0.04); }
    .card h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.6px; color:var(--accent); margin:0 0 12px; font-weight:800; }
    .row{ display:flex; flex-wrap:wrap; gap:14px 18px; margin-bottom:12px; }
    .field{ flex:1 1 calc(50% - 18px); min-width:140px; margin-bottom:6px; }
    .field.full{ flex-basis:100%; }
    .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:2px; }
    .value{ font-size:15px; font-weight:600; word-break:break-word; white-space:pre-wrap; }
    a.value, a.value:visited{ color:var(--accent); text-decoration:none; }
    a.tap{ display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
    a.tap::after{ content:attr(data-tap); font-size:11px; font-weight:600; color:#fff; background:var(--accent); border-radius:999px; padding:2px 8px; white-space:nowrap; flex-shrink:0; display:inline-block; line-height:1.4; }
    /* v3.27.0 - one card per pet, so a sitter with several pets can't mistake
       whose feeding instructions they're reading. scroll-margin keeps the pet's
       name clear of the sticky name bar when a chip is tapped. */
    .pet-card{ scroll-margin-top:60px; }
    .pet-card h3{ margin:0 0 10px; font-size:16px; color:var(--ink); display:flex; align-items:center; gap:10px; }
    /* v3.27.1 - the microchip belongs with the pet's identity, not in the middle
       of the care instructions: it's only ever needed when a pet has got out. */
    .pet-card h3 .pet-id{ display:flex; flex-direction:column; gap:3px; min-width:0; }
    .pet-card .pet-name{ display:block; }
    .pet-card .pet-chip{ font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:0.2px; word-break:break-word; text-transform:none; }
    /* Allergies sit directly under the name and microchip in red, matching the
       printed sitter sheet. Slightly darker than the paper red (#e53e3e) so it
       still clears contrast on a phone screen. The word and the symbol carry the
       warning on their own, in case a printer drops colour. */
    .pet-card .pet-allergy{ color:#c81e1e; font-weight:800; font-size:14.5px; line-height:1.45; margin:-4px 0 12px; word-break:break-word; }
    .pet-card .pet-allergy .warn{ font-weight:700; margin-right:2px; }
    .pet-avatar{ width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid rgba(91,91,214,0.3); flex-shrink:0; }
    .pet-avatar-placeholder{ width:56px; height:56px; border-radius:50%; background:rgba(91,91,214,0.12); border:2px solid rgba(91,91,214,0.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .pet-card .tag{ font-size:11px; font-weight:600; color:var(--accent); background:rgba(91,91,214,0.1); border-radius:999px; padding:2px 9px; margin-left:6px; }
    /* Sticky jump bar, shown only when there's more than one pet. Scrolls
       sideways rather than wrapping, so five names stay on one line. */
    .petnav{ position:sticky; top:0; z-index:5; display:flex; gap:8px; overflow-x:auto; padding:10px 0; margin-top:16px; background:var(--bg); -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .petnav::-webkit-scrollbar{ display:none; }
    .petnav .chip{ flex:0 0 auto; -webkit-appearance:none; appearance:none; font-family:inherit; font-size:13px; font-weight:700; line-height:1.5; color:var(--accent); background:rgba(91,91,214,0.10); border:1px solid rgba(91,91,214,0.22); border-radius:999px; padding:6px 13px; text-decoration:none; white-space:nowrap; cursor:pointer; }
    .petnav .chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
    .notes{ white-space:pre-wrap; font-size:14px; font-weight:500; }
    .footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:26px; }
    .footer strong{ color:var(--accent); }
    .empty{ text-align:center; padding:60px 20px; color:var(--muted); }
    .empty h1{ color:var(--ink); font-size:20px; }
    /* Scripture line at the bottom of the page (screen and print). */
    .foot-verse{ margin-top:1.25rem; font-size:.9rem; font-style:italic; line-height:1.5; color:var(--muted); }
    .foot-verse cite{ font-style:normal; font-size:.82em; opacity:.8; white-space:nowrap; }
    #page-foot{ max-width:640px; margin:0 auto; padding:0 16px 32px; }
    @media (max-width:420px){ .field{ flex-basis:100%; } }
    /* v3.17.32 - printing this shared page. The purple header is white text on a
       gradient, and printers routinely drop background colours ('Background
       graphics' is off by default in several print dialogs), which left the title
       as an invisible blank strip. exact is requested below but NOT relied on:
       on paper the header is dark ink (--ink) on white with a solid rule beneath
       it, so it reads whether or not backgrounds print. */
    @media print {
      header, .brand, .brand .by, header h1, header .sub {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      header {
        background: #fff !important;
        background-image: none !important;
        color: var(--ink) !important;
        border-radius: 0 !important;
        border-bottom: 2pt solid var(--ink) !important;
        padding: 0 0 8pt !important;
        margin-bottom: 12pt !important;
      }
      .brand, .brand .by, header h1, header .sub {
        color: var(--ink) !important;
        opacity: 1 !important;
      }
      /* The jump bar is a screen control; on paper each pet is already its own
         block, kept whole so instructions never split across two sheets. */
      .petnav { display: none !important; }
      .pet-card { break-inside: avoid; page-break-inside: avoid; }
      /* Ask for the red on paper, but the warning still reads in greyscale. */
      .pet-card .pet-allergy {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        color: #c81e1e !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <footer id="page-foot">
    <p class="foot-verse">&ldquo;The righteous care for the needs of their animals.&rdquo;
      <cite>&mdash; Proverbs 12:10</cite></p>
  </footer>
  <script>
  (function(){
    'use strict';
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function telHref(phone){
      var p=String(phone||''); var plus=p.trim().charAt(0)==='+'?'+':''; var digits=p.replace(/[^0-9]/g,'');
      return digits?('tel:'+plus+digits):'';
    }
    function mapsHref(addr){
      var a=String(addr||'').trim();
      return a?('https://maps.google.com/?q='+encodeURIComponent(a)):'';
    }
    // Pull "Name — phone" apart so we can make the phone tap-to-call.
    function splitNamePhone(str){
      var s=String(str||'').trim();
      if(!s) return {name:'',phone:''};
      // Look for a phone-ish chunk (has >=7 digits).
      var m=s.match(/([+(]?[\d][\d\s().\-]{6,}\d)\s*$/);
      if(m){
        var phone=m[1].trim();
        var name=s.slice(0, s.length-m[0].length).replace(/[\u2014\-\u00b7,;:\s]+$/,'').trim();
        return {name:name, phone:phone};
      }
      return {name:s, phone:''};
    }
    function decode(){
      var h=(location.hash||'').replace(/^#/,'');
      if(!h) return null;
      try{
        // Accept base64url (new links) and plain base64 (older links).
        // SMS/iMessage can turn '+' into a space, so undo that too.
        var b64 = h.replace(/ /g,'+').replace(/-/g,'+').replace(/_/g,'/');
        while (b64.length % 4) { b64 += '='; }
        var json=decodeURIComponent(escape(atob(b64)));
        return JSON.parse(json);
      }catch(e){ return null; }
    }

    // ---- Encrypted short-link path (sitter.html?id=<id>#k=<key>) ----
    // Fetch ciphertext from Supabase REST (no supabase-js needed here) and
    // decrypt with the key carried only in the URL #fragment. The key never
    // touches the server, so Supabase only ever holds unreadable ciphertext.
    var SB_URL  = 'https://mpanuzarzcfgjbheepmj.supabase.co';
    var SB_ANON = 'sb_publishable_gQ7s_Xuxnn9aYiJmaa6K_w_RYXbQRUk';

    function _b642ab(b64){ var s=atob(b64),a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; }
    function _b64urlDecode(s){ s=String(s||'').replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return s; }

    function getParam(name){
      var m = (location.search||'').match(new RegExp('[?&]'+name+'=([^&]+)'));
      return m ? decodeURIComponent(m[1]) : '';
    }
    function getKeyFromHash(){
      var h = (location.hash||'').replace(/^#/,'');
      var m = h.match(/(?:^|&)k=([^&]+)/);
      return m ? m[1] : '';
    }

    async function fetchAndDecrypt(id, keyStr){
      // 1) fetch the encrypted row from Supabase REST
      var url = SB_URL + '/rest/v1/pawfolio_sitter_links?id=eq.' + encodeURIComponent(id) + '&select=ciphertext,iv';
      var resp = await fetch(url, { headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON } });
      if(!resp.ok) throw new Error('fetch failed');
      var rows = await resp.json();
      if(!rows || !rows.length) throw new Error('not found or expired');
      var row = rows[0];
      // 2) import key from #k=
      var rawKey = _b642ab(_b64urlDecode(keyStr));
      var key = await crypto.subtle.importKey('raw', rawKey, {name:'AES-GCM'}, false, ['decrypt']);
      // 3) decrypt
      var iv = new Uint8Array(_b642ab(row.iv));
      var ctBuf = _b642ab(row.ciphertext);
      var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ctBuf);
      var json = new TextDecoder().decode(plainBuf);
      return JSON.parse(json);
    }

    function fieldText(label,val){
      if(!val) return '';
      return '<div class="field"><div class="label">'+esc(label)+'</div><div class="value">'+esc(val)+'</div></div>';
    }
    function fieldTel(label,raw){
      var np=splitNamePhone(raw);
      if(!np.name && !np.phone) return '';
      var inner;
      if(np.phone){
        var disp = np.name ? (esc(np.name)+' &middot; ') : '';
        inner = disp + '<a class="value tap" data-tap="Call" href="'+telHref(np.phone)+'">'+esc(np.phone)+'</a>';
      } else {
        inner = '<span class="value">'+esc(np.name)+'</span>';
      }
      return '<div class="field full"><div class="label">'+esc(label)+'</div><div>'+inner+'</div></div>';
    }
    function fieldAddr(label,addr){
      if(!addr) return '';
      return '<div class="field full"><div class="label">'+esc(label)+'</div><div><a class="value tap" data-tap="Map" href="'+mapsHref(addr)+'" target="_blank" rel="noopener">'+esc(addr)+'</a></div></div>';
    }
    // Render one vet's grouped info: name (plain), phone (tap-to-call), address (tap-for-maps).
    function vetBlock(label,v){
      v=v||{};
      var name=v.name||'', person=v.person||'', phone=v.phone||'', addr=v.address||'';
      if(!name && !person && !phone && !addr) return '';
      var rows='';
      if(name) rows+='<div class="value" style="font-weight:600;">'+esc(name)+'</div>';
      if(person) rows+='<div class="value">'+esc(person)+'</div>';
      if(phone) rows+='<div><a class="value tap" data-tap="Call" href="'+telHref(phone)+'">'+esc(phone)+'</a></div>';
      if(addr) rows+='<div><a class="value tap" data-tap="Map" href="'+mapsHref(addr)+'" target="_blank" rel="noopener">'+esc(addr)+'</a></div>';
      return '<div class="field full"><div class="label">'+esc(label)+'</div>'+rows+'</div>';
    }
    // v3.17.32 - the Veterinary card above already lists the primary clinic, so a
    // pet's own vet is shown only when it is genuinely a different one. Compared
    // case-insensitively, trimmed, internal whitespace collapsed, and either value
    // being contained in the other counts as a match ("Dr Rehm" matches "Dr Rehm
    // Small Animal Hospital"). Empty pet vet: nothing to show.
    function vetMatchesPrimary(petVet, primaryVet){
      var norm=function(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase(); };
      var a=norm(petVet), b=norm(primaryVet);
      if(!a) return true;
      if(!b) return false;
      return a===b || a.indexOf(b)!==-1 || b.indexOf(a)!==-1;
    }
    // v3.26.0 - a vet is up to two values: the clinic's business name and the
    // veterinarian's own name. A pet's vet is the same as the one above when ANY
    // of its values matches ANY of the primary vet's values (pairwise rule above).
    // Values are compared across both fields because older records kept a
    // clinician's name in the single clinic field. Mirrors the printed sheet.
    function vetIdentityMatchesPrimary(petVet, petVetPerson, primaryVet, primaryVetPerson){
      var clean=function(s){ return String(s==null?'':s).trim(); };
      var petVals=[clean(petVet), clean(petVetPerson)].filter(Boolean);
      if(!petVals.length) return true;
      var primVals=[clean(primaryVet), clean(primaryVetPerson)].filter(Boolean);
      if(!primVals.length) return false;
      return petVals.some(function(a){ return primVals.some(function(b){ return vetMatchesPrimary(a,b); }); });
    }
    function vetDisplay(vetName, vetPerson){
      return [vetName, vetPerson].map(function(s){ return String(s==null?'':s).trim(); }).filter(Boolean).join(' \u2014 ');
    }
    function render(d){
      var app=document.getElementById('app');
      if(!d){
        app.innerHTML='<div class="empty"><h1>Nothing to show</h1><p>This pet sitter link looks empty or incomplete. Ask the sender to share it again.</p></div>';
        return;
      }
      var o=d.owner||{}, em=d.emerg||{}, vet=d.vet||{}, evet=d.evet||{}, pets=d.pets||[];
      // Backward-compat: older links used vet.np / vet.emerg (combined name+phone strings).
      if((vet.np!==undefined || vet.emerg!==undefined) && !vet.name && !vet.phone && !evet.name && !evet.phone){
        var pnp=splitNamePhone(vet.np); var enp=splitNamePhone(vet.emerg);
        vet={ name:pnp.name, person:'', phone:pnp.phone, address:vet.address||'' };
        evet={ name:enp.name, person:'', phone:enp.phone, address:'' };
      }
      var html='';
      html+='<header><div class="wrap" style="padding:0;max-width:none;">'
        +'<div class="brand"><img src="./icon-192.png" alt="Pawfolio" width="26" height="26"><span>Pawfolio &bull; Pet Sitter Info</span><span class="by">CleartrackApps</span></div>'
        +(o.away?'<div class="sub" style="margin-top:6px;">Away: '+esc(o.away)+'</div>':'')
        +'</div></header>';
      html+='<div class="wrap">';

      // Owner & emergency
      var ownerRows='';
      ownerRows+=fieldText('Owner', o.name);
      if(o.phone) ownerRows+='<div class="field"><div class="label">Owner Phone</div><div><a class="value tap" data-tap="Call" href="'+telHref(o.phone)+'">'+esc(o.phone)+'</a></div></div>';
      ownerRows+=fieldText('Email', o.email);
      if(em.name||em.phone){
        if(em.phone) ownerRows+='<div class="field"><div class="label">Emergency Contact</div><div>'+(em.name?esc(em.name)+' &middot; ':'')+'<a class="value tap" data-tap="Call" href="'+telHref(em.phone)+'">'+esc(em.phone)+'</a></div></div>';
        else ownerRows+=fieldText('Emergency Contact', em.name);
      }
      if(ownerRows) html+='<div class="card"><h2>Contacts</h2><div class="row">'+ownerRows+'</div></div>';

      // Vet
      var vetRows='';
      vetRows+=vetBlock('Primary Vet', vet);
      vetRows+=vetBlock('Emergency Vet (24hr)', evet);
      if(vetRows) html+='<div class="card"><h2>Veterinary</h2><div class="row">'+vetRows+'</div></div>';

      // Pets - one card per pet. With more than one pet we also emit a sticky
      // bar of pet names that jumps to each card, and label each card "Pet N of
      // M" so a sitter can tell whether they've seen everybody.
      if(pets.length){
        var multiPet = pets.length > 1;
        var petsHtml='', petChips='';
        pets.forEach(function(p, i){
          var petId='pet-'+(i+1);
          var petName=esc(p.n||'Pet');
          // Buttons, NOT #anchors: on the fallback link the shared data lives in
          // the URL fragment, so setting location.hash would wipe the payload
          // (and on the short link it would wipe the decryption key).
          if(multiPet) petChips+='<button type="button" class="chip" data-target="'+petId+'">'+petName+'</button>';
          var sub=[p.sp, p.br].filter(Boolean).join(' &mdash; ');
          var rows='';
          rows+=fieldText('When to Feed', p.feed);
          rows+=fieldText('Feeding Instructions', p.food);
          rows+=fieldText('Walks', p.walk);
          rows+=p.meds?('<div class="field full"><div class="label">Medications</div><div class="value" style="white-space:pre-line;">'+esc(p.meds)+'</div></div>'):'';
          rows+=p.supps?('<div class="field full"><div class="label">Supplements</div><div class="value" style="white-space:pre-line;">'+esc(p.supps)+'</div></div>'):'';
          // Full-width + nowrap label so the short label can't wrap on paper.
          if((p.vet || p.vp) && !vetIdentityMatchesPrimary(p.vet, p.vp, vet.name, vet.person)){
            rows+='<div class="field full"><div class="label" style="white-space:nowrap;">Vet (different from above)</div><div class="value">'+esc(vetDisplay(p.vet, p.vp))+'</div></div>';
          }
          var beh = p.beh ? '<div class="field full"><div class="label">Additional Notes</div><div class="notes">'+esc(p.beh)+'</div></div>' : '';
          var avatar = p.img
            ? '<img class="pet-avatar" src="'+esc(p.img)+'" alt="'+esc(p.n||'Pet')+'">'
            : '<span class="pet-avatar-placeholder"><svg width="30" height="30" viewBox="0 0 24 24" fill="#5B5BD6" aria-hidden="true"><ellipse cx="7" cy="9" rx="1.7" ry="2.3"/><ellipse cx="12" cy="6.5" rx="1.7" ry="2.3"/><ellipse cx="17" cy="9" rx="1.7" ry="2.3"/><ellipse cx="19.5" cy="13.5" rx="1.5" ry="2"/><path d="M12 12.5c-2.4 0-4.5 1.7-5.2 3.9-.5 1.6.6 3.1 2.2 3.1.9 0 1.7-.4 3-.4s2.1.4 3 .4c1.6 0 2.7-1.5 2.2-3.1-.7-2.2-2.8-3.9-5.2-3.9z"/></svg></span>';
          var counter = multiPet ? ('<h2>Pet '+(i+1)+' of '+pets.length+'</h2>') : '<h2>Pet</h2>';
          var chipLine = p.chip ? ('<span class="pet-chip">Microchip &middot; '+esc(p.chip)+'</span>') : '';
          var allergyLine = p.allergies ? ('<div class="pet-allergy"><span class="warn">&#9888;</span> Allergies: '+esc(p.allergies)+'</div>') : '';
          petsHtml+='<div class="card pet-card" id="'+petId+'">'+counter
            +'<h3>'+avatar+'<span class="pet-id">'
              +'<span class="pet-name">'+petName+(sub?'<span class="tag">'+sub+'</span>':'')+'</span>'
              +chipLine
            +'</span></h3>'
            +allergyLine
            +'<div class="row">'+rows+beh+'</div></div>';
        });
        if(multiPet) html+='<nav class="petnav" aria-label="Jump to a pet">'+petChips+'</nav>';
        html+=petsHtml;
      }

      // Instructions
      if(d.instructions){
        html+='<div class="card"><h2>Additional Instructions/Notes</h2><div class="notes" style="padding-bottom:10px;">'+esc(d.instructions)+'</div></div>';
      }

      html+='<div class="footer">Shared from <strong>Pawfolio</strong> by CleartrackApps</div>';
      html+='</div>';
      app.innerHTML=html;
      document.title=(o.name?o.name+"'s pets — ":'')+'Pet Sitter Info — Pawfolio';
      setupPetNav();
    }
    // Highlights whichever pet is currently on screen in the sticky name bar.
    // Purely an orientation aid: if IntersectionObserver is missing, the chips
    // still scroll to their pet, just without the highlight.
    function setupPetNav(){
      var nav=document.querySelector('.petnav');
      if(!nav) return;
      var chips=[].slice.call(nav.querySelectorAll('.chip'));
      if(!chips.length) return;
      var cards=chips.map(function(c){ return document.getElementById(c.getAttribute('data-target')); });
      chips.forEach(function(c, i){
        c.addEventListener('click', function(){
          if(cards[i]) cards[i].scrollIntoView({ behavior:'smooth', block:'start' });
        });
      });
      if(!('IntersectionObserver' in window)) return;
      var io=new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(!en.isIntersecting) return;
          var idx=cards.indexOf(en.target);
          if(idx<0) return;
          chips.forEach(function(c,j){ if(j!==idx) c.classList.remove('active'); });
          chips[idx].classList.add('active');
        });
      }, { rootMargin:'-70px 0px -55% 0px', threshold:0 });
      cards.forEach(function(el){ if(el) io.observe(el); });
    }
    async function boot(){
      var app = document.getElementById('app');
      var id = getParam('id');
      if(id){
        var keyStr = getKeyFromHash();
        if(!keyStr){ render(null); return; }
        // loading state
        app.innerHTML = '<div class="empty"><h1>Loading…</h1><p>Fetching the pet sitter instructions…</p></div>';
        try{
          var d = await fetchAndDecrypt(id, keyStr);
          render(d);
        }catch(e){
          app.innerHTML = '<div class="empty"><h1>Link unavailable</h1><p>This sitter link may have expired or could not be opened. Ask the sender to share a new one.</p></div>';
        }
        return;
      }
      // Fallback: legacy long #data link
      render(decode());
    }
    boot();
    // Keep hashchange working only for the legacy #data path (no ?id).
    window.addEventListener('hashchange', function(){ if(!getParam('id')) render(decode()); });
  })();
  </script>
</body>
</html>
